name: CPU correctness

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,plots,filtering]"
      - run: python -m pytest tests -q
      - run: python scripts/run_alignment_smoke.py --plot
